name: Deploy public page

# Manual-only until Amadin approves going live. Once GitHub Pages is enabled
# for this repo (Settings > Pages > Source: GitHub Actions), restore the push
# trigger:
#   push:
#     branches: [main]
#     paths: ["public/**", ".github/workflows/deploy-public.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
